name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, type-check & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm check-types

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          API_URL: http://localhost:3001

  backend-e2e:
    name: Backend e2e tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: car_check
          POSTGRES_PASSWORD: car_check
          POSTGRES_DB: car_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://car_check:car_check@localhost:5432/car_check
      POSTGRES_USER: car_check
      POSTGRES_PASSWORD: car_check
      POSTGRES_DB: car_check
      APP_ENV: dev
      JWT_SECRET: ci-test-secret
      AWS_REGION: us-east-1
      S3_BUCKET: ci-bucket
      AWS_ACCESS_KEY_ID: ci-key
      AWS_SECRET_ACCESS_KEY: ci-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm --filter backend prisma:deploy

      - name: Run e2e tests
        run: pnpm --filter backend test:e2e

  deploy-web:
    name: Deploy Web to Vercel
    runs-on: ubuntu-latest
    needs: [ci, backend-e2e]
    if: github.event_name == 'push'

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # turbo-ignore compara contra HEAD^1; con el clone shallow por
          # defecto no existe el commit anterior.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Este job despliega por CLI, y el "Ignored Build Step" de Vercel solo
      # aplica a los deploys que dispara la integración de Git. Sin este check
      # un commit que solo toca el backend reconstruiría la web igual.
      - name: Check if web is affected
        id: affected
        run: |
          if npx --yes turbo-ignore web --fallback=HEAD^1; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "web no está afectada por este commit — se omite el deploy"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Install Vercel CLI
        if: steps.affected.outputs.changed == 'true'
        run: pnpm add -g vercel

      - name: Pull Vercel environment
        if: steps.affected.outputs.changed == 'true'
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          else
            vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
          fi

      - name: Build project
        if: steps.affected.outputs.changed == 'true'
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          else
            vercel build --token=${{ secrets.VERCEL_TOKEN }}
          fi

      - name: Deploy
        if: steps.affected.outputs.changed == 'true'
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
          else
            vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
          fi
