name: Provision Infrastructure

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to provision
        required: true
        default: dev
        type: choice
        options: [dev, prod]

concurrency:
  group: provision-infra-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  provision-s3:
    name: Provision S3
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            ENV="prod"
          else
            ENV="dev"
          fi
          echo "name=$ENV" >> $GITHUB_OUTPUT
          # Backend service ID (same service across environments)
          echo "railway_service=3adc7681-508c-4c8a-be01-d793c05b4909" >> $GITHUB_OUTPUT

          if [ "$ENV" = "prod" ]; then
            echo "railway_env_id=f14b3d44-6455-4e7b-8948-72342ee28771" >> $GITHUB_OUTPUT
            echo "frontend_url=${{ secrets.FRONTEND_URL_PROD }}" >> $GITHUB_OUTPUT
            echo "pg_service=postgres-prod" >> $GITHUB_OUTPUT
          else
            echo "railway_env_id=e924fcc6-57e0-4946-8c04-9630aab7ea93" >> $GITHUB_OUTPUT
            echo "frontend_url=${{ secrets.FRONTEND_URL_DEV }}" >> $GITHUB_OUTPUT
            echo "pg_service=Postgres" >> $GITHUB_OUTPUT
          fi

      # The backend's Joi schema (src/common/config/joi.validation.ts) rejects
      # startup unless all of these are present. The S3 ones are set further
      # down from the Terraform outputs; everything else is set here.
      - name: Ensure Railway app variables
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ steps.env.outputs.railway_env_id }}
          RAILWAY_SERVICE_ID: ${{ steps.env.outputs.railway_service }}
          PG_SERVICE_NAME: ${{ steps.env.outputs.pg_service }}
          APP_ENV: ${{ steps.env.outputs.name }}
        run: |
          python3 << 'PYEOF'
          import base64, json, os, secrets, sys, urllib.error, urllib.request

          URL = "https://backboard.railway.com/graphql/v2"
          HEADERS = {
              "Authorization": "Bearer " + os.environ["RAILWAY_API_TOKEN"],
              "Content-Type": "application/json",
              "User-Agent": "railway-cli/3.15.0",
          }

          def gql(query, variables):
              req = urllib.request.Request(
                  URL,
                  data=json.dumps({"query": query, "variables": variables}).encode(),
                  headers=HEADERS,
              )
              try:
                  with urllib.request.urlopen(req) as resp:
                      body = json.loads(resp.read())
              except urllib.error.HTTPError as e:
                  sys.exit(f"HTTP {e.code}: {e.read().decode()}")
              if "errors" in body:
                  sys.exit("GraphQL errors: " + json.dumps(body["errors"]))
              return body["data"]

          ids = {
              "projectId": os.environ["RAILWAY_PROJECT_ID"],
              "environmentId": os.environ["RAILWAY_ENVIRONMENT_ID"],
              "serviceId": os.environ["RAILWAY_SERVICE_ID"],
          }

          existing = gql(
              """query v($projectId: String!, $environmentId: String!, $serviceId: String) {
                   variables(projectId: $projectId, environmentId: $environmentId, serviceId: $serviceId)
                 }""",
              ids,
          )["variables"]

          # Rotating this would invalidate every issued JWT, so mint it only once.
          jwt_secret = existing.get("JWT_SECRET") or base64.b64encode(secrets.token_bytes(48)).decode()
          pg = os.environ["PG_SERVICE_NAME"]

          # Railway reference variable, e.g. ${ {postgres-prod.DATABASE_URL} } without
          # the spaces. Assembled from pieces so the literal "$" + "{{" sequence never
          # appears in this file - Actions would try to evaluate it as an expression.
          def ref(name):
              return "$" + "{{" + pg + "." + name + "}}"

          variables = {
              "NODE_ENV": "production",
              "APP_ENV": os.environ["APP_ENV"],
              "PORT": "3001",
              "JWT_SECRET": jwt_secret,
              # Resolved by Railway from the Postgres service in this environment
              "DATABASE_URL": ref("DATABASE_URL"),
              "POSTGRES_USER": ref("POSTGRES_USER"),
              "POSTGRES_PASSWORD": ref("POSTGRES_PASSWORD"),
              "POSTGRES_DB": ref("POSTGRES_DB"),
              "POSTGRES_PORT": ref("PGPORT"),
          }

          gql(
              """mutation up($input: VariableCollectionUpsertInput!) {
                   variableCollectionUpsert(input: $input)
                 }""",
              {"input": {**ids, "variables": variables, "skipDeploys": True}},
          )
          print("App variables set (JWT_SECRET %s)" % ("reused" if existing.get("JWT_SECRET") else "generated"))
          PYEOF

      - name: Check if S3 already provisioned
        id: check
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ steps.env.outputs.railway_env_id }}
          RAILWAY_SERVICE_ID: ${{ steps.env.outputs.railway_service }}
        run: |
          RESULT=$(python3 << 'PYEOF'
          import json, urllib.request, os, sys

          payload = json.dumps({
              "query": """
                query variables($projectId: String!, $environmentId: String!, $serviceId: String) {
                  variables(projectId: $projectId, environmentId: $environmentId, serviceId: $serviceId)
                }
              """,
              "variables": {
                  "projectId": os.environ["RAILWAY_PROJECT_ID"],
                  "environmentId": os.environ["RAILWAY_ENVIRONMENT_ID"],
                  "serviceId": os.environ["RAILWAY_SERVICE_ID"],
              }
          }).encode()

          token = os.environ["RAILWAY_API_TOKEN"]
          req = urllib.request.Request(
              "https://backboard.railway.com/graphql/v2",
              data=payload,
              headers={
                  "Authorization": "Bearer " + token,
                  "Content-Type": "application/json",
                  "User-Agent": "railway-cli/3.15.0",
              }
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  result = json.loads(resp.read())
                  variables = result.get("data", {}).get("variables") or {}
                  print("true" if "S3_BUCKET" in variables else "false")
          except urllib.error.HTTPError as e:
              print(f"HTTP {e.code}: {e.read().decode()}", file=sys.stderr)
              print("false")
          except Exception as e:
              print(f"Warning: {e}", file=sys.stderr)
              print("false")
          PYEOF
          )
          if [ "$RESULT" = "true" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "S3 already provisioned for ${{ steps.env.outputs.name }} — skipping"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "S3 not found for ${{ steps.env.outputs.name }} — provisioning"
          fi

      - name: Setup Terraform
        if: steps.check.outputs.skip == 'false'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"
          terraform_wrapper: false

      - name: Ensure Terraform state bucket exists
        if: steps.check.outputs.skip == 'false'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_TF_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_TF_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          aws s3api head-bucket --bucket car-check-tf-state 2>/dev/null || \
            aws s3api create-bucket --bucket car-check-tf-state --region us-east-1
          aws s3api put-bucket-versioning \
            --bucket car-check-tf-state \
            --versioning-configuration Status=Enabled
          aws s3api put-public-access-block \
            --bucket car-check-tf-state \
            --public-access-block-configuration \
            BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true

      - name: Clean up orphaned AWS resources
        if: steps.check.outputs.skip == 'false'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_TF_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_TF_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          ENV="${{ steps.env.outputs.name }}"
          STATE_KEY="s3/${ENV}/terraform.tfstate"

          if aws s3api head-object \
            --bucket car-check-tf-state \
            --key "$STATE_KEY" >/dev/null 2>&1; then
            echo "Terraform state exists — skipping cleanup, resources are managed"
          else
            echo "No Terraform state — cleaning up orphaned resources"

            for bucket in $(aws s3api list-buckets \
              --query "Buckets[?starts_with(Name, 'car-check-media-${ENV}-')].Name" \
              --output text 2>/dev/null); do
              echo "Removing orphaned bucket: $bucket"
              aws s3 rb "s3://$bucket" --force
            done

            USER="car-check-s3-${ENV}"
            if aws iam get-user --user-name "$USER" >/dev/null 2>&1; then
              echo "Removing orphaned IAM user: $USER"
              for policy in $(aws iam list-user-policies \
                --user-name "$USER" \
                --query 'PolicyNames[]' \
                --output text 2>/dev/null); do
                aws iam delete-user-policy --user-name "$USER" --policy-name "$policy"
              done
              for key in $(aws iam list-access-keys \
                --user-name "$USER" \
                --query 'AccessKeyMetadata[].AccessKeyId' \
                --output text 2>/dev/null); do
                aws iam delete-access-key --user-name "$USER" --access-key-id "$key"
              done
              aws iam delete-user --user-name "$USER"
            else
              echo "No orphaned IAM user: $USER"
            fi
          fi

      - name: Terraform Init
        if: steps.check.outputs.skip == 'false'
        working-directory: infra/s3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_TF_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_TF_SECRET_ACCESS_KEY }}
        run: |
          terraform init \
            -backend-config="bucket=car-check-tf-state" \
            -backend-config="key=s3/${{ steps.env.outputs.name }}/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="encrypt=true"

      - name: Terraform Apply
        if: steps.check.outputs.skip == 'false'
        working-directory: infra/s3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_TF_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_TF_SECRET_ACCESS_KEY }}
        run: |
          terraform apply -auto-approve \
            -var="env=${{ steps.env.outputs.name }}" \
            -var='allowed_origins=["${{ steps.env.outputs.frontend_url }}"]'

      - name: Inject vars into Railway
        if: steps.check.outputs.skip == 'false'
        working-directory: infra/s3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_TF_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_TF_SECRET_ACCESS_KEY }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ steps.env.outputs.railway_env_id }}
          RAILWAY_SERVICE_ID: ${{ steps.env.outputs.railway_service }}
        run: |
          export TF_BUCKET=$(terraform output -raw bucket_name)
          export TF_REGION=$(terraform output -raw aws_region)
          export TF_KEY_ID=$(terraform output -raw iam_access_key_id)
          export TF_SECRET=$(terraform output -raw iam_secret_access_key)

          python3 << 'PYEOF'
          import json, urllib.request, os, sys

          payload = json.dumps({
              "query": """
                mutation variableCollectionUpsert($input: VariableCollectionUpsertInput!) {
                  variableCollectionUpsert(input: $input)
                }
              """,
              "variables": {
                  "input": {
                      "projectId": os.environ["RAILWAY_PROJECT_ID"],
                      "environmentId": os.environ["RAILWAY_ENVIRONMENT_ID"],
                      "serviceId": os.environ["RAILWAY_SERVICE_ID"],
                      "variables": {
                          "S3_BUCKET": os.environ["TF_BUCKET"],
                          "AWS_REGION": os.environ["TF_REGION"],
                          "AWS_ACCESS_KEY_ID": os.environ["TF_KEY_ID"],
                          "AWS_SECRET_ACCESS_KEY": os.environ["TF_SECRET"],
                      },
                  }
              }
          }).encode()

          token = os.environ["RAILWAY_API_TOKEN"]
          req = urllib.request.Request(
              "https://backboard.railway.com/graphql/v2",
              data=payload,
              headers={
                  "Authorization": "Bearer " + token,
                  "Content-Type": "application/json",
                  "User-Agent": "railway-cli/3.15.0",
              }
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  result = json.loads(resp.read())
                  if "errors" in result:
                      print("GraphQL errors:", result["errors"], file=sys.stderr)
                      sys.exit(1)
                  if not result.get("data", {}).get("variableCollectionUpsert"):
                      print("variableCollectionUpsert returned false", file=sys.stderr)
                      sys.exit(1)
                  print("Variables injected successfully")
          except urllib.error.HTTPError as e:
              print(f"HTTP {e.code}: {e.read().decode()}", file=sys.stderr)
              sys.exit(1)
          PYEOF
